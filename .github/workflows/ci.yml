name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 拡張の本体は素の JS なので、manifest と content.js は web-ext の検査に任せる。
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      # 自前配布で update_url を持つため --self-hosted が要る。外すと
      # MANIFEST_UPDATE_URL のエラーになる。
      - run: npx --yes web-ext@8 lint --source-dir . --self-hosted

  # ランディングページは lp/ に独立して置いてある。
  lp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: lp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
