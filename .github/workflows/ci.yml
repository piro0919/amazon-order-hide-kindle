name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 拡張の本体は素の JS なので、manifest と content.js は web-ext の検査に任せる。
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      # 自前配布で update_url を持つため --self-hosted が要る。外すと
      # MANIFEST_UPDATE_URL のエラーになる。
      - run: npx --yes web-ext@8 lint --source-dir . --self-hosted

  # content.js を注文履歴の模造 HTML に当て、隠す対象のカードを確かめる。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.13.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # ランディングページは lp/ に独立して置いてある。
  lp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lp
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.13.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: lp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
